server:
  tomcat:
    accept-count: 1000    # TCP backlog (기본 100 → 1000 VU 동시 부하 테스트용)
    max-connections: 2000 # 동시 연결 최대 수 (기본 8192, 명시)
    threads:
      max: 400            # 워커 스레드 (기본 200 → 1000 VU 큐잉 처리 향상)

spring:
  application:
    name: matching_poc
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 48   # Supabase Nano 직접 연결 한계(60)의 80%
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      enabled: false # Swarm 모드에서는 사용하지 않음
  task:
    scheduling:
      pool:
        # 1 = 단일 스레드. fixedDelay로 이전 실행 완료 후 다음 실행만 수행. 중복 실행·겹침 방지.
        size: 1

matching:
  schedule:
    fixed-delay: 1000 # 1초. 이전 runMatchingLoop 종료 후 1초 뒤 다음 실행.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT} # Windows 예약 포트(4240-4339) 회피: 14318 사용
      transport: HTTP
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    http:
      server:
        requests:
          name: http.server.requests
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  file:
    path: ./logs
    name: ./logs/application.log
  level:
    root: INFO
    com.salang.matching_poc: DEBUG
    com.salang.matching_poc.worker.MatchScheduler: ERROR
    # SQL 로그는 기본적으로 OFF (필요시 DEBUG로 변경)
    org.hibernate.SQL: OFF
