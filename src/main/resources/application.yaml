spring:
  application:
    name: matching_poc
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      enabled: false # Swarm 모드에서는 사용하지 않음
  task:
    scheduling:
      pool:
        # 1 = 단일 스레드. fixedDelay로 이전 실행 완료 후 다음 실행만 수행. 중복 실행·겹침 방지.
        size: 1

matching:
  schedule:
    fixed-delay: 1000 # 1초. 이전 runMatchingLoop 종료 후 1초 뒤 다음 실행.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces} # 앱이 localhost에서 실행되는 경우 기본값 설정
      transport: HTTP
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    http:
      server:
        requests:
          name: http.server.requests
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  file:
    path: ./logs
    name: ./logs/application.log
  level:
    root: INFO
    com.salang.matching_poc: DEBUG
    com.salang.matching_poc.worker.MatchScheduler: ERROR
    # SQL 로그는 기본적으로 OFF (필요시 DEBUG로 변경)
    org.hibernate.SQL: OFF
