global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus 자기 메트릭 (localhost는 컨테이너 내부 기준)
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot 앱: 호스트에서 8080으로 실행할 때 (compose에 app 서비스 없음)
  - job_name: "spring-boot-app"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "host.docker.internal:8080"
        labels:
          application: "salang-backend"
    # Linux: host.docker.internal 미지원 시 extra_hosts 또는 172.17.0.1:8080 등 호스트 IP 사용